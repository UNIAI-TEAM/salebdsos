<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Đang offline — SaleBDS OS</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0b0b0f; color: #f4f4f5;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 420px; text-align: center; border: 1px solid #26262e;
        background: #13131a; border-radius: 20px; padding: 28px 24px;
      }
      h1 { font-size: 20px; margin: 0 0 10px; }
      p { font-size: 14px; line-height: 1.6; color: #a1a1aa; margin: 0 0 18px; }
      button {
        font: inherit; font-weight: 600; color: #0b0b0f; background: #a78bfa;
        border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Chưa có mạng</h1>
      <p>
        Trang này chưa được lưu để xem offline. Những trang bạn đã mở trước đó
        (Timeline, danh thiếp, landing) vẫn xem lại bình thường.
      </p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </div>
  </body>
</html>
